[project]
name = "mousedev"
version = "0.5.3"
description = "A cubic millimetre of real mouse cortex, simulated from its wiring diagram, launches a coin and picks which holder is paid from the creator fees."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "httpx>=0.27", "solders>=0.21", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
fetch = ["pandas>=2.0"]
x = ["tweepy>=4.14"]
dev = ["pytest>=8"]

[project.scripts]
mousedev = "mousedev.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mousedev"]
